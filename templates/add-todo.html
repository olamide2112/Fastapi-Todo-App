{% include 'layout.html' %}
<div class="container">
    <div class="card">
        <div class="card-header">Add Todo</div>
        <div class="card-body">
            <form id="todoForm">
                <input class="form-control mb-2" name="title" placeholder="Title" required minlength="3">
                <textarea class="form-control mb-2" name="description" placeholder="Description" required minlength="3" maxlength="100"></textarea>
                <input class="form-control mb-2" type="number" name="priority" min="1" max="5" placeholder="Priority" required>
                <button class="btn btn-primary" type="submit">Save</button>
            </form>
        </div>
    </div>
</div>
