{% include 'layout.html' %}
<div class="container">
    <div class="card">
    </div>
    <div class="card-header">
        Register
    </div>
    <div class="card-body"> 
        <form id="registerForm" action="/auth/" method="post">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Email</label>
                    <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>First Name</label>
                    <input class="form-control" type="text" name="first_name" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Last Name</label>
                    <input class="form-control" type="text" name="last_name" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Role</label>
                    <input class="form-control" type="text" name="role" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Phone Number</label>
                    <input class="form-control" type="text" name="phone_number" autocomplete="phone_number" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" name="password" autocomplete="new_password" required>
            </div>
            <div class="form-group">
                <label> Verify Password</label>
                <input type="password" class="form-control" name="password2" autocomplete="new_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </div>
    <div class="card-footer text-muted">
        <a href="/auth/login-page">Alredy have an account?</a>
    </div>
</div>
