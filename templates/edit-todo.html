{% include 'layout.html' %}
<div class="container">
    <div class="card">
        <div class="card-header">Edit Todo</div>
        <div class="card-body">
            <form id="editTodoForm">
                <input class="form-control mb-2" name="title" value="{{ todo.title }}" required minlength="3">
                <textarea class="form-control mb-2" name="description" required minlength="3" maxlength="100">{{ todo.description }}</textarea>
                <input class="form-control mb-2" type="number" name="priority" min="1" max="5" value="{{ todo.priority }}" required>
                <label class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="completed" {% if todo.completed %}checked{% endif %}>
                    Completed
                </label>
                <button class="btn btn-primary" type="submit">Save</button>
                <button class="btn btn-danger" type="button" id="deleteButton">Delete</button>
            </form>
        </div>
    </div>
</div>
